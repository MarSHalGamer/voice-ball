<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>كرة الصوت</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;800&display=swap">
<style>
:root{--sky1:#101a3a;--sky2:#3a2a6b;--ground:#5ad1a8;--ink:#f4f1ff;--ball:#ffd166;--panel:rgba(16,26,58,.88);color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--sky1);color:var(--ink);font-family:"Tajawal",system-ui,sans-serif;overflow:hidden}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;display:flex;justify-content:space-between;padding:14px 18px;font-weight:800;font-size:26px;pointer-events:none}
#hud small{font-size:15px;font-weight:500;opacity:.75;display:block}
#meter{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:18px;right:18px;display:flex;align-items:center;gap:12px;font-size:14px}
#bar{position:relative;flex:1;height:12px;border-radius:6px;background:rgba(255,255,255,.15);overflow:hidden;direction:ltr}
#fill{height:100%;width:0;background:var(--ground)}
.t{position:absolute;top:0;bottom:0;width:2px;background:#fff}
#sens{width:90px}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,14,34,.6)}
#box{background:var(--panel);border-radius:18px;padding:26px 24px;text-align:center;max-width:320px;line-height:1.7}
h1{margin:0 0 8px;font-size:28px}
p{margin:6px 0;font-size:16px}
button{margin-top:14px;font:inherit;font-weight:800;font-size:18px;padding:12px 34px;border:0;border-radius:12px;background:var(--ball);color:#1a1530;cursor:pointer}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
#skins{margin-top:10px}
.sk{margin:0 5px;padding:0;width:38px;height:38px;border-radius:50%;border:3px solid transparent;font-size:0}
.sk.on{border-color:#fff}
#snd{margin:0;padding:6px 10px;font-size:18px;background:rgba(255,255,255,.15);color:var(--ink);border-radius:10px}
#tb{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;gap:8px}
#tb button{margin:0;padding:6px 10px;font-size:20px;background:rgba(255,255,255,.18);color:var(--ink);border-radius:10px}
#toast{position:fixed;top:calc(80px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);font-size:22px;font-weight:800;background:var(--panel);padding:6px 16px;border-radius:12px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
#toast.on{opacity:1}
#panel{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,14,34,.75);z-index:5}
#pbox{background:var(--panel);border-radius:18px;padding:20px;width:min(340px,90vw);max-height:78vh;overflow:auto;text-align:center}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.12);text-align:right}
.row .nm{flex:1}.row small{opacity:.75}
.sw{width:34px;height:34px;border-radius:50%;flex:none}
.sb{margin:0;font-size:15px;padding:8px 14px}
.sb:disabled{opacity:.4}
#err{color:#ff9aa8;font-size:14px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><div><small>الحفر اللي عدّيتها</small><span id="n">0</span></div><div style="text-align:left"><small>أفضل نتيجة</small><span id="best">0</span></div></div>
<div id="meter"><span>الصوت</span><div id="bar"><div id="fill"></div><div class="t" id="tw"></div><div class="t" id="tj"></div></div><button id="snd" aria-label="الصوت">🔊</button><input id="sens" type="range" min="0.5" max="2.5" step="0.1" value="1" aria-label="الحساسية"></div>
<div id="ov"><div id="box">
<h1>كرة الصوت</h1>
<p>تكلّم بصوت عادي: تمشي الكرة.<br>ارفع صوتك: تقفز فوق الحفرة.</p>
<p>اختر لون الكرة:</p><div id="skins"></div><p id="err"></p>
<button id="go">ابدأ</button>
</div></div>
<div id="tb"><button id="bInv" aria-label="المخزن">🎒</button><button id="bShop" aria-label="المتجر">🛒</button></div>
<div id="toast"></div>
<div id="panel"><div id="pbox"></div></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
let W,H,D;
function resize(){D=window.devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;ctx.setTransform(D,0,0,D,0,0)}
addEventListener('resize',resize);resize();

let best=0;try{best=+localStorage.getItem('vb_best')||0}catch(e){}
$('best').textContent=best;

// ---- microphone ----
let ac,soundOn=true,muteUntil=0;
function sfx(t){
  if(!soundOn)return;
  if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return}}
  if(ac.state==='suspended')ac.resume();
  const P={jump:[300,620,.12],score:[660,1000,.15],fall:[420,80,.45],item:[880,1320,.1]}[t];
  const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime;
  o.type='sine';o.connect(g);g.connect(ac.destination);
  o.frequency.setValueAtTime(P[0],n);o.frequency.exponentialRampToValueAtTime(P[1],n+P[2]);
  g.gain.setValueAtTime(.12,n);g.gain.exponentialRampToValueAtTime(.001,n+P[2]);
  o.start(n);o.stop(n+P[2]+.02);
  muteUntil=performance.now()+P[2]*1000+80;
}
let analyser,buf,lvl=0,ambient=0.01,micOn=false,calibUntil=0,calibSum=0,calibN=0;
async function startMic(){
  const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false}});
  ac=ac||new (window.AudioContext||window.webkitAudioContext)();
  await ac.resume();
  analyser=ac.createAnalyser();analyser.fftSize=1024;
  ac.createMediaStreamSource(stream).connect(analyser);
  buf=new Float32Array(analyser.fftSize);micOn=true;
  calibUntil=performance.now()+900;calibSum=0;calibN=0;
}
function readMic(){
  if(!micOn)return;
  analyser.getFloatTimeDomainData(buf);
  let s=0;for(let i=0;i<buf.length;i++)s+=buf[i]*buf[i];
  const rms=Math.sqrt(s/buf.length);
  lvl=lvl*0.6+rms*0.4;
  if(performance.now()<muteUntil)lvl=0;
  if(performance.now()<calibUntil){calibSum+=rms;calibN++;ambient=Math.max(0.004,calibSum/calibN)}
}
function thresholds(){
  const k=+$('sens').value;
  const walk=(ambient*2.5+0.012)/k, jump=(ambient*3+0.07)/k*1.0;
  return {walk,jump:Math.max(jump,walk*2)};
}

// ---- keyboard / tap fallback ----
let keyWalk=false,keyJump=false;
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp')keyJump=true;if(e.code==='ArrowRight'||e.code==='ArrowLeft')keyWalk=true});
addEventListener('keyup',e=>{if(e.code==='Space'||e.code==='ArrowUp')keyJump=false;if(e.code==='ArrowRight'||e.code==='ArrowLeft')keyWalk=false});

// ---- skins & themes ----
const ICON={coin:'🟡',gem:'💎',star:'⭐'},NAME={coin:'عملة',gem:'جوهرة',star:'نجمة'};
const SK=[
 {n:'أصفر',c:'#ffd166'},{n:'وردي',c:'#ff7aa2'},{n:'سماوي',c:'#5ad1ff'},{n:'أخضر',c:'#b8f2a1'},
 {n:'أسود وأبيض مشكّل',k:'checker',cost:{coin:6}},
 {n:'برتقالي',c:'#ff9f1c',cost:{coin:10}},
 {n:'أحمر',c:'#e63946',cost:{gem:4}},
 {n:'ذهبي',k:'gold',cost:{star:3,gem:3}}];
let skin=0,owned=[0,1,2,3],inv={coin:0,gem:0,star:0},paused=false;
try{const d=JSON.parse(localStorage.getItem('vb_save')||'null');if(d){inv=Object.assign(inv,d.inv);owned=d.owned||owned;skin=owned.includes(d.skin)?d.skin:0}}catch(e){}
function save(){try{localStorage.setItem('vb_save',JSON.stringify({inv,owned,skin}))}catch(e){}}
const TH=[
 {a:'#101a3a',b:'#3a2a6b',g:'#5ad1a8',t:'#3fae87'},
 {a:'#2a1b4d',b:'#f08a5d',g:'#4c8c4a',t:'#386b37'},
 {a:'#0b3d5c',b:'#2aa7c9',g:'#e9d8a6',t:'#cbb77a'},
 {a:'#05050f',b:'#1b1040',g:'#8a86b8',t:'#6c68a0'}];
const bg=k=>k.k==='checker'?'conic-gradient(#111 0 25%,#fff 0 50%,#111 0 75%,#fff 0)':k.k==='gold'?'radial-gradient(circle at 35% 30%,#fff3b0,#ffc300 55%,#b8860b)':k.c;
const costTxt=c=>Object.keys(c).map(k=>c[k]+' '+ICON[k]).join(' + ');
const afford=c=>Object.keys(c).every(k=>inv[k]>=c[k]);
function renderSkins(){
  const e=$('skins');if(!e)return;
  e.innerHTML=SK.map((k,i)=>owned.includes(i)?'<button class="sk'+(i===skin?' on':'')+'" data-i="'+i+'" style="background:'+bg(k)+'" aria-label="'+k.n+'"></button>':'').join('');
}
let tt;
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),900)}
function openPanel(kind){
  paused=true;$('panel').style.display='flex';
  let h;
  if(kind==='inv'){
    h='<h1>🎒 المخزن</h1>'+Object.keys(ICON).map(k=>'<div class="row"><span style="font-size:26px">'+ICON[k]+'</span><span class="nm">'+NAME[k]+'</span><b>× '+inv[k]+'</b></div>').join('');
  }else{
    h='<h1>🛒 المتجر</h1><p>معك: '+Object.keys(ICON).map(k=>inv[k]+' '+ICON[k]).join('&nbsp; ')+'</p>'+SK.map((k,i)=>{
      if(!k.cost)return '';
      let b;
      if(!owned.includes(i))b='<button class="sb buy" data-i="'+i+'"'+(afford(k.cost)?'':' disabled')+'>اشترِ</button>';
      else b=i===skin?'<button class="sb" disabled>مختار</button>':'<button class="sb pick" data-i="'+i+'">اختر</button>';
      return '<div class="row"><span class="sw" style="background:'+bg(k)+'"></span><span class="nm">'+k.n+'<br><small>'+(owned.includes(i)?'ملكك':costTxt(k.cost))+'</small></span>'+b+'</div>';
    }).join('');
  }
  $('pbox').innerHTML=h+'<button id="pclose">رجوع</button>';
}
document.addEventListener('click',e=>{
  const t=e.target;let b=t.closest('.sk');
  if(b){skin=+b.dataset.i;save();renderSkins();return}
  if(t.closest('#snd')){soundOn=!soundOn;$('snd').textContent=soundOn?'🔊':'🔇';return}
  if(t.closest('#bInv')){openPanel('inv');return}
  if(t.closest('#bShop')){openPanel('shop');return}
  if(t.closest('#pclose')){$('panel').style.display='none';paused=false;renderSkins();return}
  b=t.closest('.buy');
  if(b){const i=+b.dataset.i,k=SK[i];if(afford(k.cost)){for(const x in k.cost)inv[x]-=k.cost[x];owned.push(i);skin=i;save();openPanel('shop');toast('تم الشراء!')}return}
  b=t.closest('.pick');
  if(b){skin=+b.dataset.i;save();openPanel('shop')}
});
renderSkins();

// ---- game state ----
const R=20,SPEED=200,G=1800,JV=-700;
let items=[],falling=false,worldX,y,vy,onGround,count,holes,nextHole,state='idle',angle,jumpCd;
function reset(){
  worldX=0;y=gy()-R;vy=0;onGround=true;falling=false;count=0;holes=[];items=[];nextHole=700;angle=0;jumpCd=0;
  $('n').textContent=0;state='play';
}
function gy(){return Math.round(H*0.68)}
function spawn(){
  while(nextHole<worldX+W+400){
    const w=70+Math.min(count*2.5,60)+Math.random()*30;
    holes.push({x:nextHole,w,done:false});
    const gap=Math.max(300,380-count*3)+Math.random()*220;
    if(Math.random()<0.32){
      const r=Math.random(),q=Math.random();
      let ix,off;
      if(r<0.35){ix=nextHole+w/2;off=80+Math.random()*30}
      else if(r<0.7){ix=nextHole+w+60+Math.random()*(gap-120);off=0}
      else{ix=nextHole+w+60+Math.random()*(gap-120);off=90+Math.random()*30}
      items.push({x:ix,off,t:q<0.6?'coin':q<0.9?'gem':'star',taken:false});
    }
    nextHole+=w+gap;
  }
  holes=holes.filter(h=>h.x+h.w>worldX-200);items=items.filter(i=>i.x>worldX-100);
}
const px=()=>W*0.28; // ball screen x

let last=performance.now();
function frame(now){
  const dt=Math.min(0.033,(now-last)/1000);last=now;
  readMic();
  const th=thresholds();
  if(state==='play'&&!paused){
    const loud=(micOn&&lvl>th.jump)||keyJump;
    const talk=(micOn&&lvl>th.walk)||keyWalk||loud;
    jumpCd-=dt;
    const base=gy()-R;
    if(!falling&&onGround&&loud&&jumpCd<=0){vy=JV;onGround=false;jumpCd=0.25;sfx('jump')}
    const spd=Math.min(SPEED+count*6,340);
    if(!falling&&(talk||!onGround))worldX+=spd*dt,angle+=spd*dt/R;
    spawn();
    const bx=worldX+px();
    vy+=G*dt;y+=vy*dt;
    const over=holes.some(h=>bx>h.x+R*0.4&&bx<h.x+h.w-R*0.4);
    if(!falling&&y>=base&&vy>=0){
      if(over){if(y>base+R*0.6)falling=true;onGround=false}
      else{y=base;vy=0;onGround=true}
    } else onGround=false;
    for(const h of holes){if(!h.done&&bx>h.x+h.w+R*0.4&&!falling&&y<=base+1){h.done=true;count++;$('n').textContent=count;sfx('score')}}
    for(const it of items){
      if(!it.taken&&!falling&&Math.abs(it.x-bx)<R+14&&Math.abs(gy()-R-it.off-y)<R+16){
        it.taken=true;inv[it.t]++;save();sfx('item');toast('+1 '+ICON[it.t]);
      }
    }
    if(y>H+60){endGame()}
  }
  draw();
  requestAnimationFrame(frame);
}
function endGame(){
  state='over';sfx('fall');
  if(count>best){best=count;$('best').textContent=best;try{localStorage.setItem('vb_best',best)}catch(e){}}
  $('box').innerHTML='<h1>سقطت في حفرة!</h1><p>عدّيت <b>'+count+'</b> '+(count===1?'حفرة':'حفر')+'</p><p>اختر لون الكرة:</p><div id="skins"></div><button id="go">العب مرة ثانية</button>';
  renderSkins();$('go').onclick=begin;$('ov').style.display='flex';
}
function begin(){reset();$('ov').style.display='none'}

function draw(){
  const T=TH[Math.floor((count||0)/5)%TH.length];
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,T.a);g.addColorStop(1,T.b);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // far stars
  ctx.fillStyle='rgba(255,255,255,.55)';
  for(let i=0;i<40;i++){const sx=((i*173-(worldX||0)*0.1)%W+W)%W,sy=(i*97)%(gy()-40);ctx.fillRect(sx,sy,2,2)}
  const G0=gy(),wx=worldX||0;
  // ground segments
  ctx.fillStyle=T.g;
  let cur=wx-10;
  const hs=(holes||[]).filter(h=>h.x+h.w>wx-10&&h.x<wx+W+10).sort((a,b)=>a.x-b.x);
  for(const h of hs){
    if(h.x>cur)ctx.fillRect(cur-wx,G0,h.x-cur,H-G0);
    cur=Math.max(cur,h.x+h.w);
  }
  ctx.fillRect(cur-wx,G0,wx+W+10-cur,H-G0);
  // grass top
  ctx.fillStyle=T.t;
  cur=wx-10;
  for(const h of hs){if(h.x>cur)ctx.fillRect(cur-wx,G0,h.x-cur,6);cur=Math.max(cur,h.x+h.w)}
  ctx.fillRect(cur-wx,G0,wx+W+10-cur,6);
  const nT=performance.now()/300;
  for(const it of items){
    if(it.taken)continue;
    const sx=it.x-wx;if(sx<-30||sx>W+30)continue;
    ctx.save();ctx.translate(sx,G0-R-it.off+Math.sin(nT+it.x)*4);
    if(it.t==='coin'){ctx.fillStyle='#ffd23f';ctx.strokeStyle='#c99a00';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,10,0,7);ctx.fill();ctx.stroke()}
    else if(it.t==='gem'){ctx.fillStyle='#5ad1ff';ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,-12);ctx.lineTo(10,0);ctx.lineTo(0,12);ctx.lineTo(-10,0);ctx.closePath();ctx.fill();ctx.stroke()}
    else{ctx.fillStyle='#ffe066';ctx.strokeStyle='#ff9f1c';ctx.lineWidth=2;ctx.beginPath();for(let i=0;i<10;i++){const r=i%2?6:13,a=-Math.PI/2+i*Math.PI/5;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fill();ctx.stroke()}
    ctx.restore();
  }
  // ball
  const bx=px();
  const cy=state==='idle'?G0-R:y;
  ctx.save();ctx.translate(bx,cy);ctx.rotate(angle||0);
  const S=SK[skin];
  if(S.k==='checker'){ctx.fillStyle='#111';ctx.beginPath();ctx.arc(0,0,R,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,R,0,Math.PI/2);ctx.fill();ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,R,Math.PI,Math.PI*1.5);ctx.fill()}
  else{if(S.k==='gold'){const gr=ctx.createRadialGradient(-6,-6,2,0,0,R);gr.addColorStop(0,'#fff3b0');gr.addColorStop(.55,'#ffc300');gr.addColorStop(1,'#b8860b');ctx.fillStyle=gr}else ctx.fillStyle=S.c;ctx.beginPath();ctx.arc(0,0,R,0,7);ctx.fill()}
  const ink=S.k==='checker'?'#ff4d4d':'#1a1530';
  ctx.fillStyle=ink;ctx.beginPath();ctx.arc(R*0.45,-R*0.2,3.2,0,7);ctx.fill();
  ctx.strokeStyle=ink;ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(0,0,R-5,0.3,1.5);ctx.stroke();
  ctx.restore();
  // meter
  const th=thresholds(),max=th.jump*1.6;
  $('fill').style.width=Math.min(100,lvl/max*100)+'%';
  $('fill').style.background=lvl>th.jump?'#ffd166':(lvl>th.walk?'#5ad1a8':'#8a86b8');
  $('tw').style.left=(th.walk/max*100)+'%';$('tj').style.left=(th.jump/max*100)+'%';
}

let tried=false;
$('go').onclick=async()=>{
  if(tried&&!micOn){begin();return}
  tried=true;
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('المتصفح هنا ما يدعم المايك');
    const pp=document.permissionsPolicy||document.featurePolicy;
    if(pp&&pp.allowsFeature&&!pp.allowsFeature('microphone'))throw new Error('هذه الصفحة محجوب عنها المايك من المكان اللي تفتحها فيه');
    await startMic();$('err').textContent='';begin();
  }catch(e){
    $('err').textContent='ما اشتغل المايك ('+(e.name||'')+' '+(e.message||'')+'). جرّب تفتح الرابط في Chrome أو Safari مباشرة وتسمح للمايك.';
    $('go').textContent='العب بدون مايك (اضغط الشاشة للمشي)';
  }
};
// لمس الشاشة كبديل: ضغط = مشي، ضغط في النصف الأعلى = قفز
addEventListener('pointerdown',e=>{if($('ov').style.display==='none'&&!micOn){keyWalk=true;if(e.clientY<innerHeight/2)keyJump=true}});
addEventListener('pointerup',()=>{if(!micOn){keyWalk=false;keyJump=false}});
requestAnimationFrame(frame);
</script>
</body>
</html>
